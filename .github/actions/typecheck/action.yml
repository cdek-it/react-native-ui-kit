name: Run Typechecks
description: Typecheck the project and check generated tokens

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node

    - name: Run Typecheck
      shell: bash
      run: yarn tsc --noEmit

    - name: Typecheck Token Generator
      shell: bash
      run: yarn tokens:typecheck

    - name: Check Generated Tokens
      shell: bash
      run: yarn tokens:check
